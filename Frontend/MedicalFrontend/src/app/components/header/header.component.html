<header class="header" [class.scrolled]="isScrolled()">
    <div class="header-container">

        <!-- Logo -->
        <a routerLink="/" class="logo" (click)="closeMenu()">
            <div class="logo-icon">
                <i class="fas fa-heartbeat"></i>
            </div>
            <div class="logo-text">
                <span class="logo-name">MediCare</span>
                <span class="logo-tagline">Health System</span>
            </div>
        </a>

        <!-- Nav -->
        <nav class="nav" [class.open]="isMenuOpen()">
            <div class="nav-overlay" (click)="closeMenu()"></div>

            <div class="nav-inner">

                <!-- Mobile Header -->
                <div class="nav-mobile-header">
                    <span class="logo-name">MediCare</span>
                    <button class="nav-close" (click)="closeMenu()">
            <i class="fas fa-times"></i>
          </button>
                </div>

                <!-- Links -->
                <ul class="nav-links">
                    <li>
                        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" class="nav-link" (click)="closeMenu()">
                            <i class="fas fa-home"></i> Home
                        </a>
                    </li>
                    <li>
                        <a routerLink="/doctors" routerLinkActive="active" class="nav-link" (click)="closeMenu()">
                            <i class="fas fa-user-md"></i> Doctors
                        </a>
                    </li>
                    <li>
                        <a routerLink="/departments" routerLinkActive="active" class="nav-link" (click)="closeMenu()">
                            <i class="fas fa-hospital"></i> Departments
                        </a>
                    </li>
                    <li>
                        <a routerLink="/chatbot" routerLinkActive="active" class="nav-link ai-link" (click)="closeMenu()">
                            <i class="fas fa-robot"></i> AI Diagnosis
                            <span class="ai-badge">NEW</span>
                        </a>
                    </li>
                </ul>

                <!-- Auth Buttons -->
                <div class="nav-auth">
                    @if (!isLoggedIn()) {
                    <a routerLink="/login" class="btn-login" (click)="closeMenu()">
              Sign In
            </a>
                    <a routerLink="/signup" class="btn-signup" (click)="closeMenu()">
              Get Started
            </a> } @else {
                    <a [routerLink]="getDashboardRoute()" class="user-menu" (click)="closeMenu()">
                        <div class="user-avatar">
                            {{ userName().charAt(0).toUpperCase() }}
                        </div>
                        <div class="user-info">
                            <span class="user-name">{{ userName() }}</span>
                            <span class="user-role">{{ userRole() }}</span>
                        </div>
                    </a>
                    <button class="btn-logout" (click)="logout()">
              <i class="fas fa-sign-out-alt"></i>
            </button> }
                </div>

            </div>
        </nav>

        <!-- Hamburger -->
        <button class="hamburger" [class.open]="isMenuOpen()" (click)="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </button>

    </div>
</header>
