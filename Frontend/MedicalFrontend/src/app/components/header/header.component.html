<header class="main-nav glass">
  <div class="container nav-container">
    <a routerLink="/" class="logo" aria-label="MediClinic Home">
      <div class="logo-box">
        <i class="fas fa-plus"></i>
      </div>
      <span class="logo-text">MediClinic</span>
    </a>

    <nav class="nav-links" [class.active]="mobileMenuOpen" aria-label="Main Navigation">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
      <a routerLink="/doctors" routerLinkActive="active">Doctors</a>
      <a routerLink="/services" routerLinkActive="active">Services</a>
      <a routerLink="/appointment" routerLinkActive="active">Appointments</a>
    </nav>

    <div class="auth-group">
      <a routerLink="/login" class="btn btn-outline btn-login">Login</a>
      <a routerLink="/signup" class="btn btn-primary btn-signup">Sign Up</a>
      <button class="mobile-toggle" (click)="toggleMobileMenu()" aria-label="Toggle Menu">
        <i [class]="mobileMenuOpen ? 'fas fa-times' : 'fas fa-bars'"></i>
      </button>
    </div>
  </div>
</header>
