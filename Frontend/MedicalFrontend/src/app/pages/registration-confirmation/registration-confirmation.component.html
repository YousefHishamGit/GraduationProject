<div class="confirmation-page">
  <div class="container py-20 flex-center">
    <div class="card confirmation-card text-center scale-in">
      <div class="success-glow-ring mb-8">
        <div class="ring-outer"></div>
        <div class="ring-inner">
          <i class="fas fa-envelope-open-text text-xl"></i>
        </div>
      </div>

      <h1 class="text-3xl font-bold mb-4">Verify Your Email</h1>
      <p class="text-sub mb-8 max-w-sm mx-auto">
        We've sent a secure confirmation link to your email. Please check your inbox and click the link to activate your account.
      </p>

      <div class="info-details card mb-12">
        <div class="info-item mb-4">
          <i class="fas fa-circle-info text-primary"></i>
          <span>Check your <strong>Spam/Junk</strong> folder if you don't see it.</span>
        </div>
        <div class="info-item">
          <i class="fas fa-clock text-accent"></i>
          <span>The link will expire in <strong>24 hours</strong>.</span>
        </div>
      </div>

      <div class="action-group">
        <button class="btn btn-primary btn-lg w-full" routerLink="/login">
          Return to Login
        </button>
        <button class="btn btn-outline btn-lg w-full mt-4">
          Resend Email Link
        </button>
      </div>
    </div>
  </div>
</div>
